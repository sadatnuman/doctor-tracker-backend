# Render Blueprint — one free web service for the API.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: doctor-tracker-api
    runtime: node
    plan: free
    region: singapore # closest to the Atlas cluster (AWS ap-south-1, Mumbai)
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECURE
        value: "true"
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: CLINIC_TIMEZONE
        value: Asia/Dhaka
      - key: PAYMENT_HOLD_MINUTES
        value: "5"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
